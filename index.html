<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{margin:0;background:#000}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#title{position:absolute;top:10px;left:10px;color:#fff;font-size:14px}
#go{display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);padding:12px 24px;background:#fff;color:#000;border:0;border-radius:6px;font-size:15px;z-index:10}
</style>
</head>

<body>

<p id="title"></p>

<video id="player" controls playsinline controlsList="nodownload">
<source src="" type="video/mp4">
</video>

<button id="go">Lanjutkan</button>

<script>
const JSON_URL="videos.json";
const DIRECT_LINK="https://omg10.com/4/10960953";

const video=document.getElementById("player");
const title=document.getElementById("title");
const go=document.getElementById("go");

let shown=false;

fetch(JSON_URL)
.then(res=>res.json())
.then(data=>{
const vids=data.videos;
const name=decodeURIComponent(location.hash.replace("#/",""));
let selected=vids.find(v=>v.name===name||v.id===name);
if(!selected)selected=vids[0];
video.src=selected.cdn;
title.innerText=selected.name||selected.id;
});

video.addEventListener("timeupdate",()=>{
if(!shown&&video.currentTime>=10){
shown=true;
go.style.display="block";
}
});

go.addEventListener("click",()=>{
window.location.href=DIRECT_LINK;
});
</script>

</body>
</html>
