<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{margin:0;background:#000}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#title{position:absolute;top:10px;left:10px;color:#fff;font-size:14px}
</style>
</head>

<body>

<p id="title"></p>

<video id="player" controls playsinline controlsList="nodownload">
  <source src="" type="video/mp4">
</video>

<script>
const JSON_URL = "videos.json";
const DIRECT_LINK = "https://omg10.com/4/11572586";

const video = document.getElementById("player");
const title = document.getElementById("title");

let redirected = false;

async function loadVideo(){
  try{
    const res = await fetch(JSON_URL + "?t=" + Date.now(), {cache:"no-store"});
    const data = await res.json();
    const vids = data.videos;

    if(!vids || !vids.length) return;

    const name = decodeURIComponent(location.hash.replace("#/",""));
    const selected = vids.find(v => v.name === name || v.id === name) || vids[0];

    video.src = selected.cdn;
    title.innerText = selected.name || selected.id;
  }catch(e){
    console.error(e);
  }
}

video.addEventListener("click", () => {
  if(!redirected){
    redirected = true;
    window.location.href = DIRECT_LINK;
  }
},{once:true});

video.addEventListener("timeupdate", () => {
  if(!redirected && video.currentTime >= 30){
    redirected = true;
    window.location.href = DIRECT_LINK;
  }
});

loadVideo();
</script>

</body>
</html>
