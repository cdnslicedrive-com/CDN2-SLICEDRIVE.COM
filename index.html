<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{margin:0;background:#000}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#title{position:absolute;top:10px;left:10px;color:#fff;font-size:14px}
</style>
</head>

<body>

<p id="title"></p>

<video id="player" controls playsinline controlsList="nodownload">
  <source src="" type="video/mp4">
</video>

<script>
const JSON_URL = "videos.json";

const WRAPPER_1 = "https://omg10.com/4/10960953";
const WRAPPER_2 = "https://omg10.com/4/10960953";

const video = document.getElementById("player");
const title = document.getElementById("title");

let clicked = false;
let wrapper20 = false;
let wrapper40 = false;

fetch(JSON_URL)
.then(res => res.json())
.then(data => {

  const vids = data.videos;
  const name = decodeURIComponent(location.hash.replace("#/", ""));

  let selected = vids.find(v => v.name === name);

  if (!selected) {
    selected = vids[0];
  }

  video.src = selected.cdn;
  title.innerText = selected.name;

});

video.addEventListener("click", () => {
  if (!clicked) {
    clicked = true;
    window.location.href = WRAPPER_1;
  }
});

video.addEventListener("timeupdate", () => {

  // Wrapper pertama: 20 detik
  if (!wrapper20 && video.currentTime >= 20) {
    wrapper20 = true;
    window.location.href = WRAPPER_1;
    return;
  }

  // Wrapper kedua: 40 detik
  if (!wrapper40 && video.currentTime >= 40) {
    wrapper40 = true;
    window.location.href = WRAPPER_2;
  }

});

</script>

</body>
</html>
